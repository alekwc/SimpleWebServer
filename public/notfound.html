<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Not found</title>
        <style>
            h1, h2 {
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>404 - page not found</h1>
        <h2>We could not find the requested page: <span id="url"></span></h2>
        <a href="./">Homepage</a>

        <script>
            document.getElementById("url").textContent = window.location.href
                .replace(
                    window.location.protocol + "//", 
                    "");
        </script>
    </body>
</html>
